# Standalone CI for the public ClickHouse/code-interpreter repo, which is
# published from services/codeapi as snapshot commits (see
# .github/workflows/publish-codeapi.yml in the monorepo). This file is
# inert inside the monorepo — GitHub only runs workflows from the repo
# root — and becomes the root workflow in the published repo. Keep it in
# sync with ci-codeapi.yml.
name: CI

on:
  push:
    # sync/** is included because the sync PR is opened by the GitHub Actions
    # bot, whose events don't trigger pull_request workflows — the push-event
    # runs on the branch satisfy the PR's checks instead.
    branches: [main, 'sync/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  api-unit-tests:
    name: API Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Cache Bun packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-codeapi-api-bun-1.3.13-${{ hashFiles('api/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-codeapi-api-bun-1.3.13-

      - name: Install dependencies
        run: bun ci

      - name: Build API
        run: bun run build

      - name: Compile + smoke spec-guard
        # spec-guard.c is otherwise only compiled by api/Dockerfile, which
        # the helm workflow builds post-merge. Catching syntax errors and
        # exec-semantic regressions pre-merge prevents broken sandbox
        # binaries from reaching the image build.
        working-directory: api/src
        run: |
          gcc -O2 -static -Wall -Wextra -Werror -o /tmp/spec-guard spec-guard.c
          # Smoke: spec-guard must execvp its argument cleanly. Use a
          # parent process with a known FD population so we also assert
          # the close-inherited-FDs path runs (child must see only the
          # FDs `ls` itself opens).
          PARENT_FDS=$(bash -c 'exec 10<&0 11<&0 12<&0 13<&0 14<&0; ls /proc/self/fd | wc -l')
          CHILD_FDS=$(bash -c 'exec 10<&0 11<&0 12<&0 13<&0 14<&0; /tmp/spec-guard /bin/ls /proc/self/fd | wc -l')
          echo "parent fds (with 5 extra inherited): $PARENT_FDS"
          echo "child fds via spec-guard:           $CHILD_FDS"
          test "$PARENT_FDS" -ge 8 || { echo "FAIL: parent did not actually inherit extra FDs"; exit 1; }
          test "$CHILD_FDS" -le 5 || { echo "FAIL: spec-guard did not close inherited FDs (child saw $CHILD_FDS)"; exit 1; }

      - name: Compile + smoke net-shim
        # net-shim.c is otherwise only compiled by the sandbox Dockerfiles. The
        # smoke test drives the real thing through an unmodified HTTP client:
        # HTTP_PROXY traffic must land on the unix socket, and every other
        # destination must be refused rather than redirected.
        working-directory: api/src
        run: |
          gcc -O2 -Wall -Wextra -Werror -fPIC -shared -o /tmp/net-shim.so net-shim.c -ldl
          python3 - <<'SMOKE'
          import os, socket, subprocess, sys, tempfile, threading

          sock_path = os.path.join(tempfile.mkdtemp(), "net.sock")
          seen = []

          def serve():
              srv = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
              srv.bind(sock_path)
              srv.listen(8)
              while True:
                  conn, _ = srv.accept()
                  data = b""
                  while b"\r\n\r\n" not in data:
                      chunk = conn.recv(4096)
                      if not chunk:
                          break
                      data += chunk
                  seen.append(data)
                  conn.sendall(b"HTTP/1.1 200 OK\r\nContent-Length: 4\r\nConnection: close\r\n\r\npong")
                  conn.shutdown(socket.SHUT_WR)
                  conn.close()

          threading.Thread(target=serve, daemon=True).start()

          client = (
              "import socket, urllib.request\n"
              "r = urllib.request.urlopen('http://example.com/', timeout=10)\n"
              "print('PROXIED:', r.status, r.read().decode())\n"
              "try:\n"
              "    socket.create_connection(('93.184.216.34', 80), timeout=5)\n"
              "    print('DIRECT REACHED - BAD')\n"
              "except OSError as e:\n"
              "    print('direct refused:', type(e).__name__)\n"
              "try:\n"
              "    socket.create_connection(('127.0.0.1', 9999), timeout=5)\n"
              "    print('OTHER PORT REACHED - BAD')\n"
              "except OSError as e:\n"
              "    print('other port refused:', type(e).__name__)\n"
          )

          env = dict(os.environ, LD_PRELOAD="/tmp/net-shim.so", NET_SHIM_SOCKET=sock_path,
                    NET_SHIM_PORT="8080", HTTP_PROXY="http://127.0.0.1:8080",
                    http_proxy="http://127.0.0.1:8080")
          proc = subprocess.run([sys.executable, "-c", client], env=env,
                                capture_output=True, timeout=60, text=True)
          print(proc.stdout, proc.stderr[:300])
          assert "PROXIED: 200 pong" in proc.stdout, "proxied request did not reach the unix socket"
          assert "BAD" not in proc.stdout, "shim redirected something it must refuse"
          assert seen and seen[0].startswith(b"GET http://example.com/"), "unix side saw nothing"
          print("net-shim smoke OK")
          SMOKE

      - name: Bun tests
        run: bun run test

  service-unit-tests:
    name: Service Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Cache Bun packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-codeapi-service-bun-1.3.13-${{ hashFiles('service/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-codeapi-service-bun-1.3.13-

      - name: Install dependencies
        run: bun ci

      - name: Bun tests
        run: bun run test
