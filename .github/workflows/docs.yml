# Builds the documentation site (docs/, Next.js + Fumadocs static export) and
# publishes it to GitHub Pages at https://berry-13.github.io/code-interpreter.
#
# The API reference pages are generated at build time from service/openapi.yml
# and api/openapi.yaml by docs/scripts/generate-openapi.mjs (wired to the
# `prebuild` script), so the published reference always matches the specs on
# the built commit.
#
# Pull requests build without deploying, so a change that breaks the docs build
# fails before it lands.
name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'service/openapi.yml'
      - 'api/openapi.yaml'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'service/openapi.yml'
      - 'api/openapi.yaml'
      - '.github/workflows/docs.yml'
  # Allows publishing the current main without pushing a docs change.
  workflow_dispatch:

permissions:
  contents: read

# Never cancel an in-progress deployment; queue behind it instead.
concurrency:
  group: docs-${{ github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        working-directory: docs
        run: npm ci

      - name: Build static site
        working-directory: docs
        # basePath must match the Pages project path; next.config.mjs defaults
        # to /code-interpreter. Set DOCS_BASE_PATH here to override for a
        # custom domain.
        run: npm run build

      - name: Upload Pages artifact
        # Only the deploy path needs the artifact; skip the upload on PRs.
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs/out

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
